<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>国际象棋 · AI</title>

<style>
:root {
  --cell-size: min(11vw, 70px);
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f0f4f8;
  display: flex;
  justify-content: center;
  padding: 12px;
}

.container {
  max-width: 600px;
  width: 100%;
  text-align: center;
}

h1 {
  margin: 10px 0;
  font-size: clamp(18px, 5vw, 26px);
}

#status {
  margin-bottom: 10px;
  font-size: clamp(14px, 4vw, 16px);
}

.board {
  display: grid;
  grid-template-columns: repeat(8, var(--cell-size));
  grid-template-rows: repeat(8, var(--cell-size));
  justify-content: center;
  border: 3px solid #333;
}

.cell {
  width: var(--cell-size);
  height: var(--cell-size);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--cell-size) * 0.55);
  cursor: pointer;
}

.light { background: #f6eac5; }
.dark  { background: #b5c18e; }

.highlight {
  background: rgba(255, 215, 100, 0.7) !important;
}

.piece {
  transition: transform 0.25s ease;
}

.capture {
  animation: pop 0.2s ease;
}

@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>
<div class="container">
  <h1>♟️ 国际象棋 · AI</h1>
  <div id="status">你的回合（白方）</div>
  <div class="board" id="board"></div>
</div>

<script>
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

const pieces = {
  r:"♜",n:"♞",b:"♝",q:"♛",k:"♚",p:"♟",
  R:"♖",N:"♘",B:"♗",Q:"♕",K:"♔",P:"♙"
};

const startFEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR";

let board = [], turn = "w", selected = null;

function parseFEN(fen){
  return fen.split("/").map(r=>{
    let a=[];
    for(let c of r)
      isNaN(c)?a.push(c):a.push(...Array(+c).fill(""));
    return a;
  });
}

function render(){
  boardEl.innerHTML="";
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const cell=document.createElement("div");
      cell.className=`cell ${(r+c)%2?"dark":"light"}`;
      cell.dataset.pos=`${r},${c}`;
      const p=board[r][c];
      if(p){
        const s=document.createElement("span");
        s.className="piece";
        s.textContent=pieces[p];
        cell.appendChild(s);
      }
      cell.onclick=()=>handleClick(r,c);
      boardEl.appendChild(cell);
    }
  }
}

function handleClick(r,c){
  if(turn!=="w")return;
  const p=board[r][c];
  if(selected){
    if(isValid(board,selected,[r,c])){
      move(selected,[r,c]);
      turn="b";
      statusEl.textContent="AI 思考中...";
      setTimeout(aiMove,400);
    }
    selected=null;
    clearH();
  }else if(p&&p===p.toUpperCase()){
    selected=[r,c];
    highlight(r,c);
  }
}

function move(f,t){
  const [fr,fc]=f,[tr,tc]=t;
  board[tr][tc]=board[fr][fc];
  board[fr][fc]="";
  render();
  if(board[tr][tc]){
    document.querySelectorAll(".cell").forEach(c=>{
      if(c.dataset.pos===`${tr},${tc}`)
        c.querySelector(".piece")?.classList.add("capture");
    });
  }
}

function isValid(b,f,t){
  const [fr,fc]=f,[tr,tc]=t;
  const p=b[fr][fc].toLowerCase(),dx=Math.abs(fc-tc),dy=Math.abs(fr-tr);
  if(p==="p"){
    const d=b[fr][fc]==="P"?-1:1;
    if(fc===tc&&!b[tr][tc])
      return tr-fr===d||(fr===(d===-1?6:1)&&tr-fr===d*2);
    return dx===1&&tr-fr===d&&b[tr][tc];
  }
  if(p==="r")return dx===0||dy===0;
  if(p==="n")return(dx===2&&dy===1)||(dx===1&&dy===2);
  if(p==="b")return dx===dy;
  if(p==="q")return dx===0||dy===0||dx===dy;
  if(p==="k")return dx<=1&&dy<=1;
  return false;
}

function aiMove(){
  const moves=[];
  for(let r=0;r<8;r++)
    for(let c=0;c<8;c++)
      if(board[r][c]&&board[r][c]===board[r][c].toLowerCase())
        for(let tr=0;tr<8;tr++)
          for(let tc=0;tc<8;tc++)
            if(isValid(board,[r,c],[tr,tc]))
              moves.push({from:[r,c],to:[tr,tc],score:board[tr][tc]?10:1});
  if(moves.length){
    moves.sort((a,b)=>b.score-a.score);
    move(moves[0].from,moves[0].to);
  }
  turn="w";
  statusEl.textContent="你的回合（白方）";
}

function highlight(r,c){
  clearH();
  for(let tr=0;tr<8;tr++)
    for(let tc=0;tc<8;tc++)
      if(isValid(board,[r,c],[tr,tc])){
        document.querySelectorAll(".cell").forEach(cell=>{
          if(cell.dataset.pos===`${tr},${tc}`)
            cell.classList.add("highlight");
        });
      }
}

function clearH(){
  document.querySelectorAll(".highlight")
    .forEach(e=>e.classList.remove("highlight"));
}

board=parseFEN(startFEN);
render();
</script>
</body>
</html>

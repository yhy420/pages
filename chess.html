<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>国际象棋</title>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
<style>
  body { background: #1a1a3e; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  #board { width: 400px; }
  button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; background: #0fce7c; border: none; color: #1a1a3e; border-radius: 5px; }
</style>
</head>
<body>
<div id="board"></div>
<div>
  <button onclick="undoMove()">悔棋</button>
  <button onclick="resetBoard()">重开</button>
</div>
<script>
  const game = new Chess();
  const board = Chessboard('board', {
    draggable: true,
    position: 'start',
    onDragStart: (source, piece) => {
      if (game.game_over()) return false;
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) || (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
    },
    onDrop: (source, target) => {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      if (game.game_over()) setTimeout(() => alert('Game Over'), 200);
    }
  });
  function undoMove() { game.undo(); board.position(game.fen()); }
  function resetBoard() { game.reset(); board.start(); }
</script>
</body>
</html>

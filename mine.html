<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>扫雷</title>
<style>
  body { background: #1a1a3e; display: flex; justify-content: center; align-items: center; height: 100vh; }
  table { border-collapse: collapse; }
  td { width: 30px; height: 30px; border: 1px solid #0fce7c; text-align: center; background: #333; color: white; font-weight: bold; user-select: none; }
</style>
</head>
<body>
<table id="b"></table>
<script>
const s=8, m=10;
let b=[], o=[];
function init() {
  b=Array(s).fill().map(()=>Array(s).fill(0));
  o=Array(s).fill().map(()=>Array(s).fill(0));
  let p=0;
  while(p<m){let x=Math.floor(Math.random()*s), y=Math.floor(Math.random()*s); if(!b[x][y]){b[x][y]=9; p++;}}
  for(let i=0;i<s;i++)for(let j=0;j<s;j++)if(b[i][j]!==9){let c=0; for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){let ni=i+di,nj=j+dj; if(ni>=0&&ni<s&&nj>=0&&nj<s&&b[ni][nj]===9)c++;} b[i][j]=c;}
  render();
}
function render(){
  let h='';
  for(let i=0;i<s;i++){h+='<tr>'; for(let j=0;j<s;j++){h+=`<td onclick="clickCell(${i},${j})" oncontextmenu="flag(event,${i},${j})">${o[i][j]===1?'':o[i][j]===-1?'💣':'?'}</td>`;} h+='</tr>';}
  document.getElementById('b').innerHTML=h;
}
function clickCell(i,j){
  if(o[i][j]!==0)return;
  if(b[i][j]===9){alert('BOOM!'); init(); return;}
  o[i][j]=1;
  if(b[i][j]===0) for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){let ni=i+di,nj=j+dj; if(ni>=0&&ni<s&&nj>=0&&nj<s) clickCell(ni,nj);}
  render();
}
function flag(e,i,j){e.preventDefault(); if(o[i][j]===0)o[i][j]=-1; else if(o[i][j]===-1)o[i][j]=0; render();}
init();
</script>
</body>
</html>

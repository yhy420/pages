<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mine</title>
<style>
  body { margin: 0; background: #1a1a3e; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: manipulation; }
  table { border-collapse: collapse; }
  td { width: 32px; height: 32px; border: 1px solid #0fce7c; text-align: center; background: #333; color: #fff; font-size: 16px; font-weight: bold; }
</style>
</head>
<body>
<table id="b"></table>
<script>
const N = 8, M = 10;
let map = [], open = [];
let timer;

function init() {
  map = Array(N).fill().map(() => Array(N).fill(0));
  open = Array(N).fill().map(() => Array(N).fill(0));
  let p = 0;
  while (p < M) {
    let x = Math.floor(Math.random() * N), y = Math.floor(Math.random() * N);
    if (!map[x][y]) { map[x][y] = 9; p++; }
  }
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      if (map[i][j] === 9) continue;
      let c = 0;
      for (let di = -1; di <= 1; di++)
        for (let dj = -1; dj <= 1; dj++) {
          let ni = i + di, nj = j + dj;
          if (ni >= 0 && ni < N && nj >= 0 && nj < N && map[ni][nj] === 9) c++;
        }
      map[i][j] = c;
    }
  }
  render();
}

function render() {
  let h = '';
  for (let i = 0; i < N; i++) {
    h += '<tr>';
    for (let j = 0; j < N; j++) {
      h += `<td ontouchstart="touchStart(event, ${i}, ${j})" ontouchend="touchEnd(event, ${i}, ${j})">`;
      if (open[i][j] === 1) {
        if (map[i][j] === 9) h += '💣';
        else if (map[i][j] > 0) h += map[i][j];
      } else if (open[i][j] === -1) {
        h += '🚩';
      }
      h += '</td>';
    }
    h += '</tr>';
  }
  document.getElementById('b').innerHTML = h;
}

function openCell(i, j) {
  if (open[i][j] !== 0) return;
  if (map[i][j] === 9) { alert('Boom!'); init(); return; }
  open[i][j] = 1;
  if (map[i][j] === 0) {
    for (let di = -1; di <= 1; di++)
      for (let dj = -1; dj <= 1; dj++) {
        let ni = i + di, nj = j + dj;
        if (ni >= 0 && ni < N && nj >= 0 && nj < N) openCell(ni, nj);
      }
  }
  render();
}

function touchStart(e, i, j) {
  timer = setTimeout(() => { open[i][j] = -1; render(); }, 500); // 长按插旗
}

function touchEnd(e, i, j) {
  clearTimeout(timer);
  openCell(i, j); // 短按翻开
}

init();
</script>
</body>
</html>

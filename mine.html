<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>扫雷</title>
<style>
  body { background:#1a1a3e; display:flex; justify-content:center; align-items:center; height:100vh; }
  table { border-collapse:collapse; }
  td { width:30px; height:30px; border:1px solid #0fce7c; text-align:center; background:#222; color:#fff; font-weight:bold; }
</style>
</head>
<body>
<table id="b"></table>
<script>
const N=8, M=10;
let map=[], open=[];
function init(){
  map=Array(N).fill().map(()=>Array(N).fill(0));
  open=Array(N).fill().map(()=>Array(N).fill(0));
  let p=0;
  while(p<M){ let x=Math.floor(Math.random()*N), y=Math.floor(Math.random()*N); if(!map[x][y]){ map[x][y]=9; p++; } }
  for(let i=0;i<N;i++) for(let j=0;j<N;j++) if(map[i][j]!==9){
    let c=0;
    for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){
      let ni=i+di, nj=j+dj;
      if(ni>=0&&ni<N&&nj>=0&&nj<N&&map[ni][nj]===9) c++;
    }
    map[i][j]=c;
  }
  render();
}
function render(){
  let h='';
  for(let i=0;i<N;i++){ h+='<tr>'; for(let j=0;j<N;j++){
    h+=`<td onclick="openCell(${i},${j})" oncontextmenu="flag(event,${i},${j})">`;
    if(open[i][j]===1) h+=map[i][j]===9?'💣':map[i][j]||'';
    else if(open[i][j]===-1) h='🚩';
    else h='';
    h+='</td>';
  } h+='</tr>'; }
  document.getElementById('b').innerHTML=h;
}
function openCell(i,j){
  if(open[i][j]!==0) return;
  if(map[i][j]===9){ alert('炸了！'); init(); return; }
  open[i][j]=1;
  if(map[i][j]===0) for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){
    let ni=i+di, nj=j+dj;
    if(ni>=0&&ni<N&&nj>=0&&nj<N) openCell(ni,nj);
  }
  render();
}
function flag(e,i,j){ e.preventDefault(); open[i][j]===0?open[i][j]=-1:open[i][j]=== -1?open[i][j]=0:null; render(); }
init();
</script>
</body>
</html>

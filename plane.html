<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title></title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;}
canvas{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
const c=document.getElementById('g'),ctx=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
let p={x:c.width/2-20,y:c.height-100,w:40,h:50},b=[],e=[],s=0;
setInterval(()=>b.push({x:p.x+p.w/2-3,y:p.y,w:6,h:12}),300);
setInterval(()=>e.push({x:Math.random()*(c.width-30),y:-30,w:30,h:30}),1200);
addEventListener('touchmove',e=>{e.preventDefault();p.x=e.touches[0].clientX-p.w/2;},{passive:false});
(function l(){
ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle='cyan';ctx.beginPath();ctx.moveTo(p.x+p.w/2,p.y);ctx.lineTo(p.x,p.y+p.h);ctx.lineTo(p.x+p.w,p.y+p.h);ctx.closePath();ctx.fill();
b=b.filter(l=>{l.y-=10;ctx.fillStyle='yellow';ctx.fillRect(l.x,l.y,l.w,l.h);return l.y>-10});
e=e.filter(m=>{m.y+=3;ctx.fillStyle='red';ctx.fillRect(m.x,m.y,m.w,m.h);if(m.x<p.x+p.w&&m.x+m.w>p.x&&m.y<p.y+p.h&&m.y+m.h>p.y){ctx.fillStyle='orange';ctx.font='40px Arial';ctx.textAlign='center';ctx.fillText('BOOM',c.width/2,c.height/2);setTimeout(()=>location.reload(),800)}return m.y<c.height});
ctx.fillStyle='#fff';ctx.font='20px Arial';ctx.fillText('SCORE:'+s,10,30);s++;
requestAnimationFrame(l);
})();
</script>
</body>
</html>
